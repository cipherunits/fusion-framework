[package]
name = "fusion-bench"
version = "1.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

fusion-core = { path = "../crates/fusion-core" }
axum = "0.7"
axum-server = "0.7"
hyper = "1"

