[module]
id = "security"
name = "security"
version = "0.1.0"
description = "Security headers middleware (demo)"

[module.impl]
language = "rust"

[module.targets]
python = true
typescript = true

[module.entry]
python = "fusion_security_mod"
typescript = "fusion-security-mod"

[module.build]
python = "maturin develop --release -m bindings/python/Cargo.toml"
typescript = "npm install --prefix bindings/node && npm run build --prefix bindings/node"
rust = "cargo build --release"

