# CI runs on `dev` only. Feature branches open PRs against `dev`; releases merge `dev` → `main`
# (see publish.yml). `main` does not run this workflow.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        # fusion-ffi uses raw FFI pointers; tighten to `-D warnings` once FFI lints are addressed.
        run: cargo clippy --workspace --all-targets

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check crates/fusion-py/python tests/python

      - name: ruff format
        run: ruff format --check crates/fusion-py/python tests/python

      # Node binding is a thin CommonJS wrapper over N-API; no eslint config in this repo.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node syntax check
        run: node --check crates/fusion-node/index.js

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet format
        run: dotnet format --verify-no-changes bindings/csharp/FusionFramework/FusionFramework.csproj

  rust:
    name: Rust workspace
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test fusion-core
        run: cargo test -p fusion-core
      - name: Build bindings
        run: cargo build -p fusion-py -p fusion-node

  python:
    name: Python wheel (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/fusion-py/Cargo.toml --out dist
          sccache: "true"
          manylinux: "2_28"
      - name: Install and smoke import
        shell: bash
        run: |
          pip install dist/*.whl
          pip install pytest
          python -c "from fusion_framework.api import FusionBaseApi; from fusion_framework.route import router; from fusion_framework import settings; print('ok')"
          pytest tests/python -q

  node:
    name: Node addon (${{ matrix.settings.target }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: crates/fusion-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install deps
        run: npm install
      - name: Build native addon
        run: npx napi build --platform --release --js false --target ${{ matrix.settings.target }}
      - name: Smoke require
        shell: bash
        run: |
          node -e "const f=require('./index.js'); if(!f.FusionApp||!f.status) throw new Error('smoke failed'); console.log('ok', f.status.HTTP_SUCCESS)"
          node --test ../../tests/node/unit/*.test.js

  csharp:
    name: C# package
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fusion-ffi
        run: cargo build -p fusion-ffi --release
      - name: Build FusionFramework
        run: dotnet build -c Release bindings/csharp/FusionFramework/FusionFramework.csproj
      - name: Test C# bindings
        run: dotnet test tests/csharp/FusionFramework.Tests/FusionFramework.Tests.csproj -c Release
