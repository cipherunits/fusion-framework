name: Publish PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Trusted Publishing via OIDC — no PYPI_API_TOKEN secret needed.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Wheel linux-${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Accept v1.2.3 or accidental v.1.2.3
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version tag after strip: '$TAG' (from $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${TAG}\"/" crates/fusion-py/pyproject.toml
          sed -i "s/^version.workspace = true/version = \"${TAG}\"/" crates/fusion-py/Cargo.toml || true
      # abi3-py39 → one wheel per platform; avoid -i which breaks inside manylinux docker
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release -m crates/fusion-py/Cargo.toml --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    name: Wheel windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version tag after strip: '$TAG' (from $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${TAG}\"/" crates/fusion-py/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/fusion-py/Cargo.toml --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  macos:
    name: Wheel macos-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          # - target: x86_64-apple-darwin
          #   runner: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version tag after strip: '$TAG' (from $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          # macOS/BSD sed needs a backup suffix
          sed -i.bak "s/^version = \".*\"/version = \"${TAG}\"/" crates/fusion-py/pyproject.toml
          rm -f crates/fusion-py/pyproject.toml.bak
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release -m crates/fusion-py/Cargo.toml --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG#.}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version tag after strip: '$TAG' (from $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"${TAG}\"/" crates/fusion-py/pyproject.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/fusion-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Upload to PyPI (Trusted Publishing)
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -lah dist
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
