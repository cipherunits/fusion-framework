[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fusion-framework"
version = "1.3.0"
description = "Class-based HTTP framework for Python, powered by a shared Rust core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = ["http", "framework", "hyper", "rust", "pyo3", "swagger", "openapi"]

[project.urls]
Homepage = "https://fusion.cipherunit.xyz/"
Documentation = "https://fusion.cipherunit.xyz/en/docs/python/v1"
Repository = "https://github.com/cipherunits/fusion-framework"
Issues = "https://github.com/cipherunits/fusion-framework/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "fusion_framework._fusion"
python-source = "python"
features = ["pyo3/extension-module"]
